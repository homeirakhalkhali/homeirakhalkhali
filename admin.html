
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت گالری | HOMEIRA KHALKHALI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f1eb;color:#39342e;font-family:Tahoma,Arial,sans-serif;padding:25px}
main{max-width:850px;margin:35px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 5px 30px #0000000b}
h1{text-align:center;font-size:23px;letter-spacing:1px}
p{text-align:center;color:#82796e;font-size:13px}
input,button{font:inherit;padding:13px;border:1px solid #ddd;border-radius:7px;width:100%;margin:8px 0}
button{background:#39342e;color:white;border:0;cursor:pointer}
button:hover{opacity:.85}
#panel{display:none}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px;margin-top:25px}
.item img{width:100%;height:145px;object-fit:cover;border-radius:8px}
.item button{background:#9b5148;font-size:12px;padding:9px}
#message{text-align:center;margin:12px;color:#77634e}
</style>
</head>
<body>
<main>
<h1>HOMEIRA KHALKHALI</h1>
<p>پنل مدیریت و بارگذاری تصاویر</p>

<section id="login">
<h3>ورود مدیر سایت</h3>
<input id="email" type="email" placeholder="ایمیل مدیر">
<input id="password" type="password" placeholder="رمز عبور">
<button onclick="login()">ورود به پنل</button>
</section>

<section id="panel">
<h3>بارگذاری تصاویر جدید</h3>
<input id="photos" type="file" accept="image/*" multiple>
<button onclick="uploadPhotos()">بارگذاری عکس‌ها</button>
<button onclick="logout()" style="background:#777">خروج از حساب</button>
<h3>تصاویر بارگذاری‌شده</h3>
<div id="gallery"></div>
</section>

<div id="message"></div>
</main>

<script>
const SUPABASE_URL = "https://vzzkleryyiwmzvckrudm.supabase.co";
const SUPABASE_KEY = "sb_publishable_W8gh0_XA4HF-yDvKMZGCjA_E8fgNBsC";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const message = (text) => {
  document.getElementById("message").textContent = text;
};

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message("در حال ورود...");
  const {data,error} = await db.auth.signInWithPassword({email,password});

  if(error){message("خطا در ورود: "+error.message);return;}
  showPanel();
}

async function showPanel(){
  document.getElementById("login").style.display="none";
  document.getElementById("panel").style.display="block";
  await loadPhotos();
}

async function uploadPhotos(){
  const files = document.getElementById("photos").files;
  if(!files.length){message("لطفاً ابتدا عکس انتخاب کن.");return;}

  const {data:{user}} = await db.auth.getUser();
  if(!user){message("ابتدا وارد حساب شو.");return;}

  for(const file of files){
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path = user.id+"/"+Date.now()+"-"+safeName;

    message("در حال بارگذاری: "+file.name);

    const {error} = await db.storage.from("portfolio")
      .upload(path,file,{upsert:false});

    if(error){message("خطا در بارگذاری: "+error.message);return;}
  }

  document.getElementById("photos").value="";
  message("عکس‌ها با موفقیت بارگذاری شدند.");
  await loadPhotos();
}

async function loadPhotos(){
  const {data:{user}} = await db.auth.getUser();
  if(!user)return;

  const {data,error} = await db.storage.from("portfolio")
    .list(user.id,{limit:200,sortBy:{column:"created_at",order:"desc"}});

  if(error){message("خطا در دریافت تصاویر: "+error.message);return;}

  const gallery=document.getElementById("gallery");
  gallery.innerHTML="";

  for(const file of (data||[])){
    if(!file.name || file.name.startsWith("."))continue;

    const path=user.id+"/"+file.name;
    const {data:publicData}=db.storage.from("portfolio").getPublicUrl(path);

    const item=document.createElement("div");
    item.className="item";

    const img=document.createElement("img");
    img.src=publicData.publicUrl;
    img.alt="تصویر گالری";

    const del=document.createElement("button");
    del.textContent="حذف تصویر";
    del.onclick=()=>deletePhoto(path);

    item.appendChild(img);
    item.appendChild(del);
    gallery.appendChild(item);
  }

  if(!data || data.length===0)message("هنوز عکسی بارگذاری نشده است.");
}

async function deletePhoto(path){
  if(!confirm("از حذف این تصویر مطمئنی؟"))return;

  const {error}=await db.storage.from("portfolio").remove([path]);
  if(error){message("خطا در حذف: "+error.message);return;}

  message("تصویر حذف شد.");
  await loadPhotos();
}

async function logout(){
  await db.auth.signOut();
  document.getElementById("panel").style.display="none";
  document.getElementById("login").style.display="block";
  message("از حساب خارج شدی.");
}

db.auth.getSession().then(({data})=>{
  if(data.session)showPanel();
});
</script>
</body>
</html>
